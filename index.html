<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EventosUchile · Prototipo navegable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
<style>
  :root { --navy:#00184d; --navy2:#002b7a; --orange:#fe932c; --bg:#faf8ff; --card:#ffffff; --ink:#131b2e; --mute:#444651; --line:#dae2fd; --chip:#eaedff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--ink); display: grid; grid-template-columns: 380px 1fr; }
  .ms { font-family: 'Material Symbols Outlined'; font-weight: 400; font-size: 20px; line-height: 1; display: inline-block; vertical-align: middle; font-feature-settings: 'liga'; }
  aside { height: 100vh; overflow-y: auto; padding: 24px 20px 32px; background: var(--card); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 22px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo { width: 44px; height: 44px; border-radius: 12px; background: var(--navy2); color: #fff; display: grid; place-items: center; }
  .brand h1 { font-size: 18px; margin: 0; line-height: 1.15; color: var(--navy); font-weight: 800; letter-spacing: -.01em; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: var(--mute); }
  h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); font-weight: 700; }
  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .role { border: 0; border-radius: 12px; padding: 10px; background: var(--chip); color: var(--navy); font: 700 13px 'Plus Jakarta Sans'; text-align: left; cursor: pointer; display: flex; gap: 8px; align-items: center; transition: transform .1s; }
  .role:hover { background: #dbe1ff; } .role:active { transform: scale(.97); }
  .role small { display: block; font-weight: 500; font-size: 11px; color: var(--mute); }
  .tours { display: flex; flex-direction: column; gap: 8px; }
  .tour { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; cursor: pointer; text-align: left; font: 600 13px 'Plus Jakarta Sans'; color: var(--navy); display: flex; align-items: center; gap: 10px; }
  .tour.on { background: var(--navy2); color: #fff; border-color: var(--navy2); }
  .tour small { display: block; font-weight: 500; font-size: 11px; opacity: .75; }
  .group { margin-bottom: 14px; }
  .scr { width: 100%; border: 0; background: transparent; border-radius: 10px; padding: 8px 10px; display: flex; gap: 10px; align-items: flex-start; text-align: left; cursor: pointer; font-family: inherit; color: var(--ink); }
  .scr:hover { background: var(--chip); }
  .scr.on { background: var(--chip); box-shadow: inset 3px 0 0 var(--orange); }
  .scr .ms { color: var(--navy2); margin-top: 1px; }
  .scr b { display: block; font-size: 13px; font-weight: 700; }
  .scr span.r { display: block; font-size: 11px; color: var(--mute); line-height: 1.35; margin-top: 1px; }
  .scr .new { font-size: 9px; font-weight: 800; background: var(--orange); color: #2f1500; border-radius: 99px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
  main { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; background: radial-gradient(1200px 600px at 70% 10%, #eaedff, transparent), var(--bg); }
  .phone { width: 410px; height: min(880px, calc(100vh - 110px)); background: #131b2e; border-radius: 46px; padding: 10px; box-shadow: 0 30px 70px rgba(0, 24, 77, .28), inset 0 0 0 2px #2a3350; position: relative; }
  .phone::before { content: ''; position: absolute; top: 16px; left: 50%; width: 92px; height: 22px; background: #131b2e; border-radius: 99px; transform: translateX(-50%); z-index: 3; }
  iframe { width: 100%; height: 100%; border: 0; border-radius: 36px; background: var(--bg); display: block; }
  .stepper { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 99px; padding: 6px 8px; box-shadow: 0 4px 14px rgba(0, 24, 77, .08); min-height: 44px; }
  .stepper button { border: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--chip); color: var(--navy); cursor: pointer; display: grid; place-items: center; }
  .stepper button:disabled { opacity: .35; cursor: default; }
  .stepper span.t { font-size: 12px; font-weight: 700; color: var(--navy); min-width: 220px; text-align: center; }
  .stepper span.t small { display: block; font-weight: 500; color: var(--mute); font-size: 11px; }
  .menu { display: none; }
  @media (max-width: 860px) {
    body { display: block; }
    aside { position: fixed; inset: 0; z-index: 20; transform: translateX(-100%); transition: transform .25s; }
    body.open aside { transform: none; }
    main { height: 100dvh; padding: 0; gap: 0; background: var(--bg); }
    .phone { width: 100%; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; background: transparent; }
    .phone::before { display: none; } iframe { border-radius: 0; }
    .stepper { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); z-index: 15; }
    .menu { display: grid; position: fixed; top: 10px; right: 10px; z-index: 30; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--navy2); color: #fff; place-items: center; box-shadow: 0 6px 16px rgba(0, 0, 0, .25); cursor: pointer; }
  }
</style>
</head>
<body>
<button class="menu" id="menu" aria-label="Menú del prototipo"><span class="ms">menu</span></button>

<aside>
  <div class="brand">
    <div class="logo"><span class="ms">account_balance</span></div>
    <div><h1>EventosUchile</h1><p>Prototipo navegable · v1.0 · Grupo 2</p></div>
  </div>

  <section>
    <h2>Entrar como…</h2>
    <div class="roles">
      <button class="role" data-role="estudiante"><span class="ms">school</span><span>Estudiante<small>Consulta y guarda</small></span></button>
      <button class="role" data-role="organizacion"><span class="ms">verified</span><span>Organización<small>Verificada</small></span></button>
      <button class="role" data-role="organizacion_pendiente"><span class="ms">hourglass_top</span><span>Org. en revisión<small>Solicitud enviada</small></span></button>
      <button class="role" data-role="administrador"><span class="ms">admin_panel_settings</span><span>Administrador<small>Nivel Root</small></span></button>
    </div>
  </section>

  <section>
    <h2>Recorridos para la demo</h2>
    <div class="tours" id="tours"></div>
  </section>

  <section>
    <h2>Todas las pantallas <span id="count" style="font-weight:500"></span></h2>
    <div id="screens"></div>
  </section>
</aside>

<main>
  <div class="phone"><iframe id="frame" title="Prototipo EventosUchile" src="iniciar_sesi_n_comunidad_uchile/code.html"></iframe></div>
  <div class="stepper" id="stepper" hidden>
    <button id="prev" aria-label="Paso anterior"><span class="ms">chevron_left</span></button>
    <span class="t" id="steptxt"></span>
    <button id="next" aria-label="Paso siguiente"><span class="ms">chevron_right</span></button>
  </div>
</main>

<script src="_proto/router.js"></script>
<script>
(function () {
  var R = proto.routes;
  // [clave, título, icono, requisito(s) que cubre, nuevo?]
  var GROUPS = [
    ['Acceso', [
      ['login', 'Iniciar sesión', 'login', 'Acceso con cuenta institucional'],
      ['registro', 'Registro de estudiantes', 'person_add', 'Acceso con cuenta institucional'],
      ['solicitud', 'Solicitud de organización', 'how_to_reg', 'Solicitar cuenta de organización'],
      ['ayuda', 'Ayuda y privacidad', 'help_center', 'Protección de datos personales', 1]
    ]],
    ['Comunidad', [
      ['portada', 'Inicio', 'home', 'Listado de eventos próximos'],
      ['explorar', 'Explorar y filtrar', 'search', 'Búsqueda y filtros'],
      ['detalle', 'Ficha del evento', 'event', 'Ficha del evento · Marcar como de interés'],
      ['calendario', 'Calendario', 'calendar_month', 'Vista de calendario'],
      ['guardados', 'Guardados e inscripciones', 'bookmark', 'Mis eventos guardados'],
      ['notificaciones', 'Notificaciones', 'notifications', 'Recordatorio · Aviso de cambio o cancelación · Aviso de cuenta', 1],
      ['perfil', 'Perfil y ajustes', 'account_circle', 'Preferencias de recordatorios y avisos', 1]
    ]],
    ['Organizaciones', [
      ['panelOrg', 'Panel del organizador', 'corporate_fare', 'Panel del organizador · Importaciones'],
      ['crear', 'Crear evento', 'add_circle', 'Publicar un evento · Registro de creación'],
      ['editar', 'Editar o cancelar evento', 'edit_calendar', 'Editar o cancelar un evento · Aviso de cambio', 1],
      ['informe', 'Asistencia e informe', 'analytics', 'Panel del organizador (asistencia, calificaciones)', 1]
    ]],
    ['Administración', [
      ['adminSolicitudes', 'Solicitudes de verificación', 'fact_check', 'Aprobar o rechazar una cuenta'],
      ['adminDictamen', 'Dictamen de solicitud', 'gavel', 'Aprobar o rechazar una cuenta · Aviso al solicitante'],
      ['adminImportados', 'Eventos importados', 'move_to_inbox', 'Importaciones · Revisión periódica · Duplicados · Aviso de pendientes', 1],
      ['adminImportado', 'Revisar evento importado', 'rule', 'Revisar un evento importado · Fuente de origen', 1],
      ['adminOrganizaciones', 'Organizaciones', 'domain', 'Solo organizaciones verificadas', 1],
      ['adminAuditoria', 'Auditoría y registros', 'policy', 'Registro de creación · Procesos autónomos · Archivado', 1]
    ]]
  ];
  var TOURS = [
    {n: 'Comunidad', s: 'Consultar, guardar y recibir avisos', role: 'estudiante', icon: 'school',
     steps: ['login', 'portada', 'explorar', 'detalle', 'calendario', 'guardados', 'notificaciones', 'perfil']},
    {n: 'Organización', s: 'Solicitar cuenta, publicar y mantener', role: 'estudiante', icon: 'corporate_fare',
     steps: ['solicitud', 'adminSolicitudes', 'adminDictamen', 'panelOrg', 'crear', 'editar', 'informe'],
     roles: {adminSolicitudes: 'administrador', panelOrg: 'organizacion'}},
    {n: 'Administración', s: 'Verificar, revisar importados y auditar', role: 'administrador', icon: 'admin_panel_settings',
     steps: ['adminSolicitudes', 'adminDictamen', 'adminImportados', 'adminImportado', 'adminOrganizaciones', 'adminAuditoria']}
  ];
  var LABEL = {};
  GROUPS.forEach(function (g) { g[1].forEach(function (s) { LABEL[s[0]] = s[1]; }); });

  var frame = document.getElementById('frame');
  var current = 'login', tour = null, step = 0;

  function load(key, role) {
    var rel = key.indexOf('#') > -1 ? key.split('#')[1] : '', k = key.split('#')[0];
    var q = k.indexOf('?') > -1 ? k.split('?')[1] : ''; k = k.split('?')[0];
    if (role) {
      proto.setRole(role);
      try { frame.name = 'EUPROTO:' + JSON.stringify({ role: role }); } catch (e) {}
    }
    frame.src = R[k] + '/code.html' + (q ? '?' + q : '') + (rel ? '#' + rel : '');
    document.body.classList.remove('open');
  }
  var ENTRY = { estudiante: 'portada', organizacion: 'panelOrg', organizacion_pendiente: 'solicitud#seguimiento', administrador: 'adminSolicitudes' };
  document.querySelectorAll('.role').forEach(function (b) {
    b.onclick = function () { tour = null; paintTours(); load(ENTRY[b.dataset.role], b.dataset.role); updateStepper(); };
  });

  // Lista de pantallas
  var box = document.getElementById('screens'), total = 0;
  GROUPS.forEach(function (g) {
    var d = document.createElement('div'); d.className = 'group';
    d.innerHTML = '<h2>' + g[0] + '</h2>';
    g[1].forEach(function (s) {
      total++;
      var b = document.createElement('button'); b.className = 'scr'; b.dataset.key = s[0];
      b.innerHTML = '<span class="ms">' + s[2] + '</span><span><b>' + s[1] + (s[4] ? '<span class="new">NUEVA</span>' : '') + '</b><span class="r">' + s[3] + '</span></span>';
      b.onclick = function () { tour = null; paintTours(); updateStepper(); load(s[0] === 'adminImportado' ? 'adminImportado?id=2' : s[0] === 'informe' ? 'informe?e=ros#asistencia' : s[0]); };
      d.appendChild(b);
    });
    box.appendChild(d);
  });
  document.getElementById('count').textContent = '(' + total + ')';

  // Recorridos
  var tbox = document.getElementById('tours');
  function paintTours() {
    tbox.innerHTML = '';
    TOURS.forEach(function (t, i) {
      var b = document.createElement('button'); b.className = 'tour' + (tour === i ? ' on' : '');
      b.innerHTML = '<span class="ms">' + t.icon + '</span><span>' + t.n + '<small>' + t.s + ' · ' + t.steps.length + ' pasos</small></span>';
      b.onclick = function () { tour = i; step = 0; paintTours(); go(); };
      tbox.appendChild(b);
    });
  }
  function go() {
    var t = TOURS[tour], k = t.steps[step];
    load(k === 'adminImportado' ? 'adminImportado?id=2' : k === 'informe' ? 'informe?e=ros#asistencia' : k, (t.roles && t.roles[k]) || (step === 0 ? t.role : null));
    updateStepper();
  }
  function updateStepper() {
    var s = document.getElementById('stepper');
    s.hidden = tour === null;
    if (tour === null) return;
    var t = TOURS[tour];
    document.getElementById('steptxt').innerHTML = 'Paso ' + (step + 1) + ' de ' + t.steps.length + '<small>' + t.n + ' · ' + LABEL[t.steps[step]] + '</small>';
    document.getElementById('prev').disabled = step === 0;
    document.getElementById('next').disabled = step === t.steps.length - 1;
  }
  document.getElementById('prev').onclick = function () { if (step > 0) { step--; go(); } };
  document.getElementById('next').onclick = function () { if (step < TOURS[tour].steps.length - 1) { step++; go(); } };
  document.getElementById('menu').onclick = function () { document.body.classList.toggle('open'); };

  // La vista actual avisa cuál es para resaltarla en la lista
  window.addEventListener('message', function (e) {
    if (!e.data || !e.data.eventosuchile) return;
    current = e.data.page;
    document.querySelectorAll('.scr').forEach(function (b) { b.classList.toggle('on', b.dataset.key === current); });
  });
  paintTours();
})();
</script>
</body>
</html>
