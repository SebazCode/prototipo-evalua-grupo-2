</section></main><script src="../../_proto/router.js"></script><script>
var SRCI = {ucursos:['school','bg-primary-fixed text-primary','https://www.u-cursos.cl'], social:['photo_camera','bg-secondary-fixed text-secondary','https://instagram.com'], correo:['mail','bg-tertiary-fixed text-tertiary-container','https://correo.uchile.cl']};
var DATA = {
 1:{src:'ucursos', from:'U-Cursos · Facultad de Medicina', at:'18 Abr 2025 · 07:55', rec:'IMP-2039', conf:96,
    text:'Charla abierta «Inteligencia Artificial en Salud». Martes 22 de abril, 12:30 hrs. Aula Magna, Facultad de Medicina (Independencia 1027). Organiza: Escuela de Medicina. Entrada liberada.',
    f:[['Título','text','Charla Inteligencia Artificial en Salud','Alta'],['Fecha','date','2025-04-22','Alta'],['Hora','time','12:30','Alta'],['Lugar','text','Aula Magna, Fac. de Medicina','Alta'],['Organizador','text','Escuela de Medicina','Media'],['Categoría','text','Académico / Charla','Media']]},
 2:{src:'social', from:'Instagram · @openbeauchef', at:'18 Abr 2025 · 07:12', rec:'IMP-2041', conf:88,
    text:'🚀 ¡Este sábado 19/4 se viene el Hackathon IA & Sustentabilidad en Beauchef! 9:30 hrs en el Hall Sur. Inscripciones en el link de la bio. #OpenBeauchef #UChile',
    f:[['Título','text','Hackathon IA & Sustentabilidad Beauchef','Alta'],['Fecha','date','2025-04-19','Alta'],['Hora','time','09:30','Alta'],['Lugar','text','Hall Sur, Beauchef 851','Media'],['Organizador','text','OpenBeauchef','Media'],['Categoría','text','Feria / Encuentro','Media']],
    dup:{pct:92, other:'Hackathon IA & Sustentabilidad Beauchef 2025', rows:[['Título','Hackathon IA & Sustentabilidad Beauchef','Hackathon IA & Sustentabilidad Beauchef 2025',true],['Fecha','Sáb 19 Abr · 09:30','Sáb 19 Abr · 09:30',true],['Lugar','Hall Sur, Beauchef 851','Hall Sur, Beauchef 851',true],['Organiza','OpenBeauchef','DTI + OpenBeauchef',false]]}},
 3:{src:'correo', from:'Correo · difusion.postgrado@uchile.cl', at:'18 Abr 2025 · 05:40', rec:'IMP-2036', conf:79,
    text:'Estimada comunidad: les invitamos a la Feria de Postgrado UChile 2025, el martes 29 de abril desde las 10:00 hrs. Más información próximamente. Dirección de Postgrado.',
    f:[['Título','text','Feria de Postgrado UChile 2025','Alta'],['Fecha','date','2025-04-29','Alta'],['Hora','time','10:00','Media'],['Lugar','text','','Falta'],['Organizador','text','Dirección de Postgrado','Alta'],['Categoría','text','Feria / Encuentro','Media']]},
 4:{src:'ucursos', from:'U-Cursos · Dirección de Asuntos Estudiantiles', at:'17 Abr 2025 · 18:20', rec:'IMP-2033', conf:94,
    text:'Taller «Estudio Efectivo y Gestión del Tiempo». Miércoles 23 de abril, 16:00 hrs, Sala 204 Edificio DAE. Cupos limitados, inscripción previa.',
    f:[['Título','text','Taller de Estudio Efectivo','Alta'],['Fecha','date','2025-04-23','Alta'],['Hora','time','16:00','Alta'],['Lugar','text','Sala 204, Edificio DAE','Alta'],['Organizador','text','Dirección de Asuntos Estudiantiles','Alta'],['Categoría','text','Taller Práctico','Media']]},
 5:{src:'ucursos', from:'U-Cursos · Deportes UChile', at:'17 Abr 2025 · 16:05', rec:'IMP-2031', conf:91,
    text:'Torneo Interfacultades de Futsal. Viernes 18 de abril a las 15:00 hrs en el Polideportivo del Campus JGM. Organiza Deportes UChile.',
    f:[['Título','text','Torneo Interfacultades de Futsal','Alta'],['Fecha','date','2025-04-18','Alta'],['Hora','time','15:00','Alta'],['Lugar','text','Campus JGM · Polideportivo','Alta'],['Organizador','text','Deportes UChile','Alta'],['Categoría','text','Deportes','Alta']],
    dup:{pct:85, other:'Torneo Interfacultades de Futsal 2025', rows:[['Título','Torneo Interfacultades de Futsal','Torneo Interfacultades de Futsal 2025',true],['Fecha','Vie 18 Abr · 15:00','Vie 18 Abr · 15:00',true],['Lugar','Campus JGM · Polideportivo','Campus JGM · Polideportivo',true],['Organiza','Deportes UChile','Rama de Futsal Beauchef',false]]}}
};
var m = /[?&]id=(\d+)/.exec(location.search);
var id = (m && DATA[m[1]]) ? m[1] : '2';
var D = DATA[id];
var S = SRCI[D.src];
document.getElementById('r-srcicon').className = 'w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0 ' + S[1];
document.getElementById('r-srcglyph').textContent = S[0];
document.getElementById('r-from').textContent = D.from;
document.getElementById('r-when').textContent = 'Importado ' + D.at;
document.getElementById('r-rec').textContent = D.rec;
document.getElementById('r-text').textContent = '«' + D.text + '»';
document.getElementById('r-link').href = S[2];
document.getElementById('r-conf').textContent = 'Confianza global ' + D.conf + ' %';

var CONF = {Alta:'bg-emerald-100 text-emerald-900', Media:'bg-amber-100 text-amber-900', Falta:'bg-error-container text-on-error-container'};
var fb = document.getElementById('r-fields');
D.f.forEach(function(x){
  var w = document.createElement('div'); w.className = 'flex flex-col gap-1.5';
  w.innerHTML = '<div class="flex items-center justify-between"><label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider font-bold"></label><span class="px-2 py-0.5 rounded-full font-label-caps text-label-caps font-bold ' + CONF[x[3]] + '">' + (x[3] === 'Falta' ? 'Falta' : 'Confianza ' + x[3].toLowerCase()) + '</span></div>' +
    '<input class="w-full h-11 px-space-sm bg-surface-container-low text-on-surface rounded-lg font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none transition-colors" type="' + x[1] + '">';
  w.querySelector('label').textContent = x[0];
  var inp = w.querySelector('input'); inp.value = x[2]; inp.setAttribute('data-field', x[0]);
  if (x[3] === 'Falta') { inp.placeholder = 'Completa este dato para poder publicar'; inp.style.boxShadow = 'inset 0 0 0 1.5px #ba1a1a'; }
  inp.addEventListener('input', function(){ inp.style.boxShadow = inp.value ? '' : inp.style.boxShadow; });
  fb.appendChild(w);
});

var choice;
if (D.dup) {
  var box = document.getElementById('r-dup'); box.classList.remove('hidden'); box.classList.add('flex');
  document.getElementById('r-dup-title').textContent = 'Coincidencia del ' + D.dup.pct + ' % con un evento ya publicado';
  var cmp = document.getElementById('r-compare');
  cmp.innerHTML = '<span class="font-label-caps text-label-caps text-on-error-container uppercase font-bold">Importado</span><span class="font-label-caps text-label-caps text-on-error-container uppercase font-bold">Ya publicado</span>';
  D.dup.rows.forEach(function(r){
    [r[1], r[2]].forEach(function(v, k){
      var c = document.createElement('div'); c.className = 'p-2.5 rounded-lg bg-surface-container-lowest flex flex-col gap-0.5';
      c.innerHTML = '<span class="font-label-caps text-label-caps text-on-surface-variant uppercase flex items-center gap-1"></span><span class="font-body-sm text-body-sm text-on-surface font-semibold"></span>';
      c.querySelectorAll('span')[0].textContent = r[0] + (r[3] ? ' ✓' : ' ≠');
      c.querySelectorAll('span')[1].textContent = v;
      if (!r[3]) c.style.boxShadow = 'inset 0 0 0 1.5px #fe932c';
      cmp.appendChild(c);
    });
  });
  choice = 'fusionar';
} else { choice = 'aprobar'; }

var OPTS = D.dup ? [['fusionar','merge','Fusionar con el evento existente','Conserva el publicado y agrega esta fuente.'],['aprobar','add_circle','Publicar como evento nuevo','No es un duplicado, se publica por separado.'],['rechazar','block','Rechazar importación','No se publicará.']]
                 : [['aprobar','task_alt','Aprobar y publicar','Visible para toda la comunidad.'],['rechazar','block','Rechazar importación','No se publicará.']];
var reason = null;
function drawChoices(){
  var b = document.getElementById('r-choices'); b.innerHTML = '';
  OPTS.forEach(function(o){
    var on = o[0] === choice, bad = o[0] === 'rechazar';
    var d = document.createElement('button'); d.type = 'button';
    d.className = 'flex items-center gap-3 p-3 rounded-xl text-left transition-all active:scale-[.99] ' + (on ? (bad ? 'bg-error-container text-on-error-container' : 'bg-primary-container text-on-primary') : 'bg-surface-container text-on-surface');
    d.innerHTML = '<span class="material-symbols-outlined text-[22px]">' + o[1] + '</span><span class="flex flex-col"><span class="font-label-lg text-label-lg font-bold"></span><span class="font-body-sm text-body-sm opacity-80"></span></span>';
    var sp = d.querySelectorAll('span'); sp[1].textContent = o[2]; sp[2].textContent = o[3];
    d.onclick = function(){ choice = o[0]; drawChoices(); };
    b.appendChild(d);
  });
  var rj = document.getElementById('r-reject'); rj.classList.toggle('hidden', choice !== 'rechazar'); rj.classList.toggle('flex', choice === 'rechazar');
  var cb = document.getElementById('r-confirm');
  cb.className = 'w-full h-12 rounded-xl font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 shadow-sm active:scale-95 transition-all ' + (choice === 'rechazar' ? 'bg-error text-on-error' : 'bg-primary-container text-on-primary');
  document.getElementById('r-confirm-tx').textContent = choice === 'rechazar' ? 'Confirmar rechazo' : (choice === 'fusionar' ? 'Fusionar y confirmar' : 'Aprobar y publicar');
}
var REASONS = ['Fuera del ámbito universitario','Información incompleta','Fines comerciales','Duplicado'];
var rb = document.getElementById('r-reasons');
function drawReasons(){
  rb.innerHTML = '';
  REASONS.forEach(function(r){
    var b = document.createElement('button'); b.type = 'button'; b.textContent = r;
    b.className = 'px-3 py-1.5 rounded-full font-label-md text-label-md transition-all ' + (reason === r ? 'bg-error text-on-error font-bold' : 'bg-surface-container-high text-on-surface-variant font-semibold');
    b.onclick = function(){ reason = r; drawReasons(); }; rb.appendChild(b);
  });
}
drawChoices(); drawReasons();

document.getElementById('r-confirm').onclick = function(){
  if (choice === 'rechazar' && !reason) { proto.toast('Selecciona una causal de rechazo', 'info'); return; }
  if (choice !== 'rechazar') {
    var empty = Array.prototype.filter.call(document.querySelectorAll('[data-field]'), function(i){ return !i.value.trim(); })[0];
    if (empty) { empty.focus(); empty.scrollIntoView({behavior:'smooth', block:'center'}); proto.toast('Completa «' + empty.getAttribute('data-field') + '» antes de publicar', 'warning'); return; }
  }
  var msg = choice === 'rechazar' ? 'Importación rechazada · ' + reason : choice === 'fusionar' ? 'Fusionado con el evento existente · fuente registrada' : 'Evento publicado · fuente de origen registrada';
  var b = this; b.disabled = true;
  document.getElementById('r-confirm-ic').textContent = 'progress_activity'; document.getElementById('r-confirm-ic').classList.add('animate-spin');
  setTimeout(function(){ proto.go('adminImportados', msg); }, 800);
};
</script></body></html>
