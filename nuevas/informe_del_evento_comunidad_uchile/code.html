  </head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-gutter-mobile flex items-center justify-between"><div class="flex items-center gap-space-xs min-w-0"><button aria-label="Volver atrás" class="w-11 h-11 flex items-center justify-center text-primary rounded-full hover:bg-surface-container flex-shrink-0" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[22px]">arrow_back</span></button><div class="flex flex-col min-w-0"><span class="font-label-caps text-label-caps text-on-surface-variant font-bold tracking-wider uppercase truncate">Panel de organización</span><h1 class="font-headline-sm text-headline-sm text-primary line-clamp-1">Informe del evento</h1></div></div><div class="flex items-center gap-space-xs flex-shrink-0"></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-10 bg-surface min-h-screen">

  </div>

  <div class="grid grid-cols-3 gap-1 p-1 bg-surface-container rounded-xl" id="i-tabs">
    <button class="py-2 rounded-lg font-label-md text-label-md" data-t="resumen" type="button">Resumen</button>
    <button class="py-2 rounded-lg font-label-md text-label-md" data-t="asistencia" type="button">Asistencia</button>

  </div>

  <!-- RESUMEN -->
  <div class="flex flex-col gap-4" data-pane="resumen">
    <div class="grid grid-cols-2 gap-3" id="i-kpis"></div>
    <div class="bg-surface-container-lowest rounded-2xl p-4 shadow-sm flex flex-col gap-3">
      <h3 class="font-label-lg text-label-lg font-bold text-on-surface">Inscripciones por día</h3>
      <div class="flex items-end gap-2 h-28" id="i-bars"></div>
      <div class="flex justify-between font-label-caps text-label-caps text-on-surface-variant" id="i-bars-x"></div>
    </div>
    <div class="bg-surface-container-lowest rounded-2xl p-4 shadow-sm flex flex-col gap-2.5" id="i-stars-box">
      <h3 class="font-label-lg text-label-lg font-bold text-on-surface">Calificaciones</h3><div class="flex flex-col gap-1.5" id="i-stars"></div>
    </div>
  </div>

  <!-- ASISTENCIA -->
  <div class="hidden flex-col gap-3" data-pane="asistencia">
    <div class="flex items-center justify-between"><span class="font-label-lg text-label-lg font-bold text-on-surface" id="i-count"></span>
      <button class="px-3 py-1.5 rounded-full bg-surface-container-high text-primary font-label-md text-label-md font-bold flex items-center gap-1 active:scale-95 transition-all" id="i-csv" type="button"><span class="material-symbols-outlined text-[16px]">download</span>Exportar</button></div>
    <div class="w-full h-2 rounded-full bg-surface-container-high overflow-hidden"><div class="h-full bg-primary-container rounded-full transition-all" id="i-progress" style="width:0%"></div></div>
    <div class="relative"><span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">search</span>
      <input class="w-full h-11 pl-10 pr-3 bg-surface-container-lowest rounded-xl shadow-sm font-body-md text-body-md focus:outline-none" id="i-search" placeholder="Buscar inscrito…" type="text"></div>

  <!-- COMENTARIOS -->

</section></main><script src="../../_proto/router.js"></script><script>
var EVENTS = {
  charla: {title:'Charla Industria 4.0 con Ex-Alumnos', badge:'Realizado', badgeCls:'bg-surface-container-high text-on-surface-variant', when:'29 Mar 2025 · FCFM',
    kpis:[['Inscritos','110','groups'],['Asistentes','92','how_to_reg'],['Asistencia','84 %','percent'],['Calificación','4.8 / 5','star']],
    bars:[8,15,22,31,19,10,5], barsX:['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],
    stars:[[5,78],[4,16],[3,4],[2,2],[1,0]],
    checkable:false,
    comments:[['Matías F.','5','Excelente charla, los ex-alumnos contaron casos reales de la industria.'],['Javiera L.','5','Muy buena organización. Ojalá repitan con más empresas.'],['Diego A.','4','Buen contenido, faltó tiempo para preguntas.']]},
  ros: {title:'Taller Introductorio a ROS y Drones', badge:'Publicado', badgeCls:'bg-emerald-100 text-emerald-900', when:'Jue 18 Abr · 14:30 hrs · Auditorio Gorbea',
    kpis:[['Inscritos','45 / 50','groups'],['Cupos libres','5','event_seat'],['Guardados','7','bookmark'],['Check-in','abre 14:00','schedule']],
    bars:[4,9,14,10,5,2,1], barsX:['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],
    stars:null, checkable:true, comments:null}
};
var ATT = [['Camila Herrera Soto','Ing. Civil Eléctrica'],['Matías Fuentes Rojas','Ing. Civil en Computación'],['Javiera Lagos Pinto','Ing. Civil Mecánica'],['Diego Araya Núñez','Ing. Civil Industrial'],['Valentina Muñoz Díaz','Ing. Civil Eléctrica'],['Sebastián Vega Mora','Ing. Civil en Computación'],['Antonia Reyes Vidal','Ing. Civil Matemática'],['Joaquín Pizarro Gil','Ing. Civil Mecánica']];
var q = /[?&]e=([a-z]+)/.exec(location.search);
var cur = (q && EVENTS[q[1]]) ? q[1] : 'charla';
var tab = (location.hash || '').replace('#', '') || 'resumen';
if (['resumen','asistencia','comentarios'].indexOf(tab) < 0) tab = 'resumen';
var present = {0:1,1:1,3:1};

function drawEvents(){
  var box = document.getElementById('i-events'); box.innerHTML = '';
  Object.keys(EVENTS).forEach(function(k){
    var b = document.createElement('button'); b.type = 'button';
    b.className = 'flex-1 py-2 px-2 rounded-lg font-label-md text-label-md truncate ' + (k === cur ? 'bg-surface-container-lowest text-primary font-bold shadow-sm' : 'text-on-surface-variant font-semibold');
    b.textContent = k === 'charla' ? 'Charla Industria 4.0' : 'Taller ROS y Drones';
    b.onclick = function(){ cur = k; draw(); };
    box.appendChild(b);
  });
}
function drawTabs(){
  document.querySelectorAll('#i-tabs button').forEach(function(b){
    var on = b.getAttribute('data-t') === tab;
    b.className = 'py-2 rounded-lg font-label-md text-label-md ' + (on ? 'bg-surface-container-lowest text-primary font-bold shadow-sm' : 'text-on-surface-variant font-semibold');
    b.onclick = function(){ tab = b.getAttribute('data-t'); draw(); };
  });
  document.querySelectorAll('[data-pane]').forEach(function(p){
    var on = p.getAttribute('data-pane') === tab;
    p.classList.toggle('hidden', !on); p.classList.toggle('flex', on);
  });
}
function drawList(){
  var E = EVENTS[cur], term = document.getElementById('i-search').value.toLowerCase();
  var list = document.getElementById('i-list'); list.innerHTML = '';
  var n = 0;
  ATT.forEach(function(a, i){
    if (term && a[0].toLowerCase().indexOf(term) < 0) return;
    var d = document.createElement('button'); d.type = 'button';
    var on = !!present[i] || !E.checkable;
    if (on) n++;
    d.className = 'flex items-center gap-3 p-3 rounded-xl bg-surface-container-lowest shadow-sm text-left active:scale-[.99] transition-all';
    d.innerHTML = '<div class="w-10 h-10 rounded-full bg-primary-fixed text-primary flex items-center justify-center font-label-lg text-label-lg font-bold flex-shrink-0">' + a[0].charAt(0) + '</div>' +
      '<div class="flex-1 min-w-0 flex flex-col"><span class="font-label-lg text-label-lg text-on-surface truncate"></span><span class="font-body-sm text-body-sm text-on-surface-variant truncate"></span></div>' +
      '<span class="material-symbols-outlined text-[26px] ' + (on ? 'text-primary-container' : 'text-outline-variant') + '" style="font-variation-settings:\'FILL\' ' + (on ? 1 : 0) + '">' + (on ? 'check_circle' : 'radio_button_unchecked') + '</span>';
    d.querySelectorAll('span')[0].textContent = a[0]; d.querySelectorAll('span')[1].textContent = a[1];
    d.onclick = function(){ if (!E.checkable) return; present[i] = present[i] ? 0 : 1; drawList(); };
    list.appendChild(d);
  });
  var total = E.checkable ? Object.keys(present).filter(function(k){return present[k];}).length : ATT.length;
  document.getElementById('i-count').textContent = E.checkable ? total + ' de ' + ATT.length + ' con check-in (muestra)' : 'Lista de asistencia · muestra de ' + ATT.length;
  document.getElementById('i-progress').style.width = Math.round(total / ATT.length * 100) + '%';
}
function draw(){
  var E = EVENTS[cur];
  drawEvents(); drawTabs();
  document.getElementById('i-title').textContent = E.title;
  document.getElementById('i-when').textContent = E.when;
  var bd = document.getElementById('i-badge'); bd.textContent = E.badge; bd.className = 'px-2.5 py-1 rounded-full font-label-caps text-label-caps font-bold ' + E.badgeCls;
  var k = document.getElementById('i-kpis'); k.innerHTML = '';
  E.kpis.forEach(function(x){
    var c = document.createElement('div'); c.className = 'bg-surface-container-lowest rounded-2xl p-3.5 shadow-sm flex flex-col gap-1';
    c.innerHTML = '<div class="flex items-center justify-between"><span class="' + 'font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider font-bold"></span><span class="material-symbols-outlined text-primary text-[18px]">' + x[2] + '</span></div><span class="font-headline-md text-headline-md text-primary font-bold"></span>';
    c.querySelectorAll('span')[0].textContent = x[0]; c.querySelectorAll('span')[2].textContent = x[1]; k.appendChild(c);
  });
  var max = Math.max.apply(null, E.bars);
  document.getElementById('i-bars').innerHTML = E.bars.map(function(v){ return '<div class="flex-1 flex flex-col items-center justify-end gap-1 h-full"><span class="font-label-caps text-label-caps text-on-surface-variant">' + v + '</span><div class="w-full rounded-t-lg bg-primary-container" style="height:' + Math.max(6, Math.round(v / max * 80)) + '%"></div></div>'; }).join('');
  document.getElementById('i-bars-x').innerHTML = E.barsX.map(function(x){ return '<span class="flex-1 text-center">' + x + '</span>'; }).join('');
  var sb = document.getElementById('i-stars-box'); sb.style.display = E.stars ? '' : 'none';
  if (E.stars) document.getElementById('i-stars').innerHTML = E.stars.map(function(s){ return '<div class="flex items-center gap-2"><span class="w-6 font-label-md text-label-md text-on-surface-variant">' + s[0] + '★</span><div class="flex-1 h-2 rounded-full bg-surface-container-high overflow-hidden"><div class="h-full rounded-full bg-secondary-container" style="width:' + s[1] + '%"></div></div><span class="w-9 text-right font-label-md text-label-md text-on-surface-variant">' + s[1] + ' %</span></div>'; }).join('');
  var cm = document.getElementById('i-comments');
  cm.innerHTML = E.comments ? '' : '<div class="flex flex-col items-center gap-2 py-10 text-center"><span class="material-symbols-outlined text-[40px] text-outline">rate_review</span><p class="font-label-lg text-label-lg text-on-surface">Aún no hay comentarios</p><p class="font-body-sm text-body-sm text-on-surface-variant">Los asistentes podrán calificar el evento una vez realizado.</p></div>';
  (E.comments || []).forEach(function(c){
    var d = document.createElement('div'); d.className = 'bg-surface-container-lowest rounded-2xl p-3.5 shadow-sm flex flex-col gap-1';
    d.innerHTML = '<div class="flex items-center justify-between"><span class="font-label-lg text-label-lg font-bold text-on-surface"></span><span class="flex items-center gap-0.5 text-secondary font-label-md text-label-md font-bold"><span class="material-symbols-outlined text-[16px]" style="font-variation-settings:\'FILL\' 1">star</span></span></div><p class="font-body-md text-body-md text-on-surface-variant"></p>';
    d.querySelectorAll('span')[0].textContent = c[0]; d.querySelectorAll('span')[1].insertAdjacentText('beforeend', ' ' + c[1]); d.querySelector('p').textContent = c[2]; cm.appendChild(d);
  });
  drawList();
}
document.getElementById('i-search').addEventListener('input', drawList);
document.getElementById('i-csv').onclick = function(){ proto.toast('Lista de asistencia exportada (.csv)', 'download'); };
draw();
</script></body></html>
