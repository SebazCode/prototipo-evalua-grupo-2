    </div>
    <span class="px-2.5 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-caps text-label-caps font-bold" id="n-count">0 sin leer</span>
  </div>
  <div class="flex gap-2 overflow-x-auto no-scrollbar py-0.5" id="n-filters"></div>
  <div class="flex flex-col gap-2.5" id="n-list"></div>
  <div id="n-empty" class="hidden flex-col items-center gap-2 py-10 text-center">
    <span class="material-symbols-outlined text-[40px] text-outline">notifications_off</span>
    <p class="font-label-lg text-label-lg text-on-surface">Estás al día</p>
    <p class="font-body-sm text-body-sm text-on-surface-variant">No hay avisos en esta categoría.</p>
  </div>
  <button class="mt-2 w-full h-12 rounded-xl bg-surface-container-high text-primary font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 active:scale-95 transition-all" id="n-prefs" type="button">
    <span class="material-symbols-outlined text-[20px]">tune</span> Preferencias de avisos
  </button>
</section></main><script src="../../_proto/router.js"></script><script>
var role = proto.getRole();
var TONE = {
  info:  'bg-primary-fixed text-primary',
  warn:  'bg-secondary-fixed text-secondary',
  danger:'bg-error-container text-on-error-container',
  ok:    'bg-emerald-100 text-emerald-900'
};
var FEEDS = {
  estudiante: [
    {g:'Eventos', day:'Hoy', icon:'alarm', tone:'info', tag:'Recordatorio', t:'Mañana: Hackathon IA & Sustentabilidad Beauchef', b:'Recordatorio de tu evento guardado. Sábado 19 Abr · 09:30 hrs, Hall Sur, Beauchef 851.', time:'Hace 2 h', unread:1, to:'detalle'},
    {g:'Eventos', day:'Hoy', icon:'edit_calendar', tone:'warn', tag:'Cambio', t:'Cambio de sala: Charla Astronomía de Datos', b:'El organizador movió la charla del Auditorio Gorbea a la Sala B-12. La hora no cambia (17:00).', time:'Hace 5 h', unread:1, to:'detalle'},
    {g:'Eventos', day:'Ayer', icon:'event_busy', tone:'danger', tag:'Cancelación', t:'Cancelado: Taller de Postulación a Fondos Concursables', b:'La Dirección de Asuntos Estudiantiles canceló la actividad por fuerza mayor. Se liberó tu inscripción.', time:'Ayer', unread:0, to:'guardados'},
    {g:'Eventos', day:'Ayer', icon:'alarm_on', tone:'info', tag:'Recordatorio', t:'Empieza en 1 hora: Torneo Interfacultades de Futsal', b:'Campus JGM · Polideportivo, 15:00 hrs.', time:'Ayer', unread:0, to:'detalle'},
    {g:'Eventos', day:'Esta semana', icon:'star', tone:'warn', tag:'Reseña', t:'¿Cómo estuvo Cine Debate: Memoria Universitaria?', b:'Cuéntanos tu experiencia y ayuda a otros estudiantes a elegir.', time:'Hace 6 días', unread:0, to:'guardados'}
  ],
  organizacion: [
    {g:'Cuenta', day:'Hoy', icon:'verified', tone:'ok', tag:'Cuenta aprobada', t:'¡Tu organización fue verificada!', b:'Club de Robótica y Automatización ya puede publicar y mantener eventos en la cartelera.', time:'Hace 3 h', unread:1, to:'panelOrg'},
    {g:'Eventos', day:'Hoy', icon:'fact_check', tone:'info', tag:'Importación', t:'2 eventos importados esperan tu revisión', b:'Detectamos actividades desde U-Cursos y desde Instagram (@robotica_uchile).', time:'Hace 5 h', unread:1, to:'panelOrg'},
    {g:'Eventos', day:'Ayer', icon:'groups', tone:'ok', tag:'Inscripciones', t:'Taller Introductorio a ROS y Drones: 45 de 50 cupos', b:'Se sumaron 6 inscritos desde ayer. Revisa la lista de asistencia.', time:'Ayer', unread:0, to:'informe?e=ros#asistencia'},
    {g:'Cuenta', day:'Esta semana', icon:'cancel', tone:'danger', tag:'Cuenta rechazada', t:'Solicitud rechazada: Colectivo Arte JGM', b:'Causal: falta respaldo de la DAI. Puedes corregir los datos y volver a enviarla.', time:'Hace 4 días', unread:0, to:'solicitud'},
    {g:'Eventos', day:'Esta semana', icon:'edit_note', tone:'warn', tag:'Borrador', t:'Tu borrador «Torneo Interno de Sumobots» sigue sin fecha', b:'Complétalo para publicarlo y empezar a recibir inscripciones.', time:'Hace 5 días', unread:0, to:'crear'}
  ],
  organizacion_pendiente: [
    {g:'Cuenta', day:'Hoy', icon:'hourglass_top', tone:'warn', tag:'En revisión', t:'Tu solicitud está en revisión', b:'Solicitud #UCH-7842 · Colectivo Arte JGM. Respuesta estimada en 24 a 48 horas hábiles.', time:'Hace 1 día', unread:1, to:'solicitud#seguimiento'},
    {g:'Cuenta', day:'Hoy', icon:'mail', tone:'info', tag:'Aviso', t:'Te avisaremos cuando haya una decisión', b:'Recibirás un aviso aquí y por correo cuando tu cuenta sea aprobada o rechazada.', time:'Hace 1 día', unread:0, to:'solicitud#seguimiento'}
  ],
  administrador: [
    {g:'Revisión', day:'Hoy', icon:'move_to_inbox', tone:'warn', tag:'Pendientes de revisión', t:'5 eventos importados pendientes de revisión', b:'U-Cursos (3), redes sociales (1) y correo institucional (1).', time:'Hace 30 min', unread:1, to:'adminImportados'},
    {g:'Revisión', day:'Hoy', icon:'content_copy', tone:'danger', tag:'Duplicado', t:'Posible duplicado detectado (92 %)', b:'«Hackathon IA & Sustentabilidad Beauchef» ya existe en la cartelera.', time:'Hace 1 h', unread:1, to:'adminImportado?id=2'},
    {g:'Cuenta', day:'Hoy', icon:'how_to_reg', tone:'info', tag:'Solicitudes', t:'8 solicitudes de organización esperan dictamen', b:'La más antigua lleva 2 días: Centro de Estudiantes de Antropología.', time:'Hace 2 h', unread:1, to:'adminSolicitudes'},
    {g:'Sistema', day:'Ayer', icon:'sync', tone:'ok', tag:'Revisión periódica', t:'Revisión periódica de fuentes completada', b:'U-Cursos y correo institucional sin problemas. Redes sociales: 1 error de lectura.', time:'Ayer', unread:0, to:'adminAuditoria'},
    {g:'Cuenta', day:'Esta semana', icon:'mark_email_read', tone:'ok', tag:'Aviso enviado', t:'Aviso enviado: Rama de Futsal Beauchef aprobada', b:'La organización fue notificada y ya puede publicar eventos.', time:'Hace 3 días', unread:0, to:'adminAuditoria'}
  ]
};
var LABEL = {estudiante:'Avisos para estudiantes', organizacion:'Avisos de tu organización', organizacion_pendiente:'Avisos de tu solicitud', administrador:'Avisos de administración'};
var feed = FEEDS[role] || FEEDS.estudiante;
document.getElementById('n-role').textContent = LABEL[role] || LABEL.estudiante;
var filter = 'Todas';
var groups = ['Todas', 'Sin leer'];
feed.forEach(function(n){ if (groups.indexOf(n.g) < 0) groups.push(n.g); });

function render() {
  var unread = feed.filter(function(n){return n.unread;}).length;
  document.getElementById('n-count').textContent = unread + (unread === 1 ? ' sin leer' : ' sin leer');
  document.getElementById('n-count').style.display = unread ? '' : 'none';
  var fl = document.getElementById('n-filters'); fl.innerHTML = '';
  groups.forEach(function(g){
    var b = document.createElement('button'); b.type = 'button';
    var on = g === filter;
    b.className = 'flex-shrink-0 px-3.5 py-1.5 rounded-full font-label-md text-label-md transition-all active:scale-95 ' +
      (on ? 'bg-primary-container text-on-primary font-bold shadow-sm' : 'bg-surface-container-lowest text-on-surface-variant font-semibold shadow-sm');
    b.textContent = g; b.onclick = function(){ filter = g; render(); }; fl.appendChild(b);
  });
  var list = document.getElementById('n-list'); list.innerHTML = '';
  var shown = feed.filter(function(n){ return filter === 'Todas' || (filter === 'Sin leer' ? n.unread : n.g === filter); });
  document.getElementById('n-empty').classList.toggle('hidden', shown.length > 0);
  document.getElementById('n-empty').classList.toggle('flex', shown.length === 0);
  var lastDay = '';
  shown.forEach(function(n){
    if (n.day !== lastDay) {
      lastDay = n.day;
      var h = document.createElement('span');
      h.className = 'font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider font-bold pt-2';
      h.textContent = n.day; list.appendChild(h);
    }
    var a = document.createElement('article');
    a.className = 'relative flex gap-3 p-3.5 rounded-2xl shadow-sm cursor-pointer transition-all active:scale-[.99] ' + (n.unread ? 'bg-surface-container-lowest' : 'bg-surface-container-low');
    a.innerHTML =
      '<div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0 ' + TONE[n.tone] + '"><span class="material-symbols-outlined text-[22px]">' + n.icon + '</span></div>' +
      '<div class="min-w-0 flex-1 flex flex-col gap-1">' +
        '<div class="flex items-start justify-between gap-2"><span class="font-label-caps text-label-caps uppercase tracking-wider font-bold ' + (n.unread ? 'text-secondary' : 'text-on-surface-variant') + '">' + n.tag + '</span>' +
        '<span class="font-label-caps text-label-caps text-on-surface-variant whitespace-nowrap">' + n.time + '</span></div>' +
        '<h3 class="font-label-lg text-label-lg ' + (n.unread ? 'font-bold' : 'font-semibold') + ' text-on-surface leading-snug"></h3>' +
        '<p class="font-body-sm text-body-sm text-on-surface-variant"></p>' +
        '<span class="inline-flex items-center gap-1 text-primary font-label-md text-label-md font-bold pt-0.5">Ver <span class="material-symbols-outlined text-[16px]">arrow_forward</span></span>' +
      '</div>' + (n.unread ? '<span class="absolute top-3.5 right-3.5 hidden"></span>' : '');
    a.querySelector('h3').textContent = n.t; a.querySelector('p').textContent = n.b;
    if (n.unread) a.style.boxShadow = 'inset 3px 0 0 #fe932c, 0 1px 3px rgba(0,0,0,.06)';
    a.onclick = function(){ n.unread = 0; proto.go(n.to); };
    list.appendChild(a);
  });
}
document.getElementById('n-markall').onclick = function(){ feed.forEach(function(n){ n.unread = 0; }); render(); proto.toast('Todo marcado como leído', 'done_all'); };
document.getElementById('n-prefs').onclick = function(){ proto.go('perfil#avisos'); };
render();
</script></body></html>
